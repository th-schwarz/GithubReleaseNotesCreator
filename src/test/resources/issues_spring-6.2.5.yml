  "comments" : 2,
  "body" : "Please see https://github.com/spring-projects/spring-boot/issues/44706 for background. It would be useful to have a method similar to `SimpleAutowireCandidateResolver.resolveAutowireCandidates(ConfigurableListableBeanFactory, Class<T>)` that only considers singleton beans. The key to addressing https://github.com/spring-projects/spring-boot/issues/44706 is to avoid any attempt to create prototype beans.",
