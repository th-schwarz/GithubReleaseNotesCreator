  "comments" : 0,
  "body" : "Although we have a Checkstyle rule which _attempts_ to enforce the use of `BDDMockito`...\n\nhttps://github.com/spring-projects/spring-framework/blob/ce815006d23891cc4eb7b098fe00fa51114a684f/src/checkstyle/checkstyle.xml#L223-L229\n\n... that rule does not actually enforce anything.\n\nFor example, it's still possible to statically import methods declared in `Mockito` via `BDDMockito`, and that has happened numerous times across the code base.\n\n```java\nimport static org.mockito.BDDMockito.doThrow;\nimport static org.mockito.BDDMockito.mock;\nimport static org.mockito.BDDMockito.times;\nimport static org.mockito.BDDMockito.verify;\nimport static org.mockito.BDDMockito.when;\nimport static org.mockito.BDDMockito.willAnswer;\n```\n\nDuring a team discussion, we decided that the team currently has no preference regarding `BDDMockito` stubbing APIs over traditional `Mockito` stubbing APIs. In addition, certain IDEs (for example, Eclipse) covert static imports for `org.mockito.BDDMockito.when` to `org.mockito.Mockito.when` which then fails the Gradle build even though the latter import is technically more _correct_.\n\nIn light of that, we have decided to simply remove the `BDDMockito` Checkstyle rule.",
