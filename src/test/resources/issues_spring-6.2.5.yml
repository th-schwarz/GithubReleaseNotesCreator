  "closed_at" : "2025-03-19T12:36:34Z",
  "comments" : 3,
  "body" : "In version 5.1.x, the `ServletUriComponentsBuilder` methods changed to remove the usage of forwarded headers:\n* code change: [`4da43de`](https://github.com/spring-projects/spring-framework/commit/4da43de7e1df1fb4f73c0a496b81d7c863c4a50c#diff-cb1a52c2cfe83769cf62baab4af9b1a91354557dde3d6fda2d21f84e465764c9); https://github.com/spring-projects/spring-framework/issues/21209\n* docs clarifications: [`bb5c8ed`](https://github.com/spring-projects/spring-framework/commit/bb5c8ed4e8061eaf8ba990f1d54c3a6f761cf868#diff-cb1a52c2cfe83769cf62baab4af9b1a91354557dde3d6fda2d21f84e465764c9)); https://github.com/spring-projects/spring-framework/issues/21850\n\nHowever, the method and class documentation in `MvcUriComponentsBuilder` was not updated and still indicates the forwarded headers are used. (see instances of `Note:` in the [javadocs](https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/web/servlet/mvc/method/annotation/MvcUriComponentsBuilder.html#:~:text=Note:%20This%20class%20uses%20values%20from%20\"Forwarded\")) Yet `MvcUriComponentsBuilder` internally uses `ServletUriComponentsBuilder` for URI components resolution:\n\nhttps://github.com/spring-projects/spring-framework/blob/a0763d13c5032c9042bb56b1e6f899c0a6661991/spring-webmvc/src/main/java/org/springframework/web/servlet/mvc/method/annotation/MvcUriComponentsBuilder.java#L560-L564\n\nThis affects 5.1.x -> 7.0.x.\n\n---\n\nSimple test:\n```java\n@Test\nvoid testMvcUriComponentsBuilder() {\n    MockHttpServletRequest request = new MockHttpServletRequest();\n    request.setServerName(\"localhost\");\n    request.setServerPort(8080);\n    request.setScheme(\"http\");\n\n    request.addHeader(\"X-Forwarded-Proto\", \"https\");\n    request.addHeader(\"X-Forwarded-Host\", \"test.example.com\");\n    request.addHeader(\"X-Forwarded-Port\", \"443\");\n\n    RequestContextHolder.setRequestAttributes(new ServletRequestAttributes(request, new MockHttpServletResponse()));\n\n    @Controller\n    @RequestMapping(\"/test\")\n    class InnerController {}\n\n    String expected = MvcUriComponentsBuilder.fromController(InnerController.class).toUriString();\n    assertEquals(expected, \"https://test.example.com\");\n}\n```\n\nError:\n```\nexpected: <http://localhost:8080/test> but was: <https://test.example.com>\n```",
