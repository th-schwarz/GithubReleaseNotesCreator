  "comments" : 0,
  "body" : "`SseBuilder#comment` expects the comment to have length. However, an empty comment is accepted and is commonly sent as a keepalive message. \n\nThe [spec has this](https://html.spec.whatwg.org/multipage/server-sent-events.html#parsing-an-event-stream) for the ABNF:\n\n> comment       = colon *any-char end-of-line\n\nAnd also for parsing guidelines:\n\n> If the line starts with a U+003A COLON character (:)\n> Ignore the line.\n\n",
